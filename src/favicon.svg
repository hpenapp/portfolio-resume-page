<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Circuit / data flow icon -->
  <!-- Horizontal rail top -->
  <line x1="4" y1="10" x2="28" y2="10" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Horizontal rail bottom -->
  <line x1="4" y1="22" x2="28" y2="22" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Vertical connectors -->
  <line x1="10" y1="10" x2="10" y2="22" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="16" y2="22" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="22" y2="22" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Node dots on top rail -->
  <circle cx="10" cy="10" r="2.5" fill="#22d3ee"/>
  <circle cx="16" cy="10" r="2.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="22" cy="10" r="2.5" fill="#22d3ee"/>
  <!-- Node dots on bottom rail -->
  <circle cx="10" cy="22" r="2.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="16" cy="22" r="2.5" fill="#22d3ee"/>
  <circle cx="22" cy="22" r="2.5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <!-- Data flow arrow tip right -->
  <polyline points="25,7 28,10 25,13" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
